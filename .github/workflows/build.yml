name: Build SSMS22 VSIX

on:
  push:
    branches: [master, ssms22-support]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    # windows-2022 ships Visual Studio 2022 (MSBuild 17), which the
    # .NET Framework 4.8 / VSSDK project needs. VSSDK.BuildTools comes from NuGet.
    runs-on: windows-2022
    env:
      PROJECT: SSMS22/SSMS22.csproj
    steps:
      - uses: actions/checkout@v4

      - uses: microsoft/setup-msbuild@v2

      - name: Restore
        run: msbuild $env:PROJECT /t:Restore /p:Configuration=Release

      - name: Stamp build version
        # Give each CI build a unique VSIX version (4.2.<run>) so VSIXInstaller treats it as
        # an upgrade instead of "already installed".
        shell: pwsh
        run: |
          $v = "4.2.${{ github.run_number }}"
          $m = 'SSMS22/source.extension.vsixmanifest'
          (Get-Content $m -Raw) -replace '(<Identity [^>]*Version=")[^"]+', "`${1}$v" | Set-Content $m -Encoding utf8
          $a = 'SSMS22/Properties/AssemblyInfo.cs'
          (Get-Content $a -Raw) -replace 'Version\("4\.2\.0"\)', "Version(`"$v`")" | Set-Content $a -Encoding utf8
          Select-String -Path $m -Pattern '<Identity'
          Select-String -Path $a -Pattern 'AssemblyVersion'

      - name: Build VSIX
        run: msbuild $env:PROJECT /p:Configuration=Release /p:DeployExtension=false /v:minimal

      - name: Locate VSIX
        id: vsix
        shell: pwsh
        run: |
          $files = Get-ChildItem SSMS22/bin/Release -Filter *.vsix
          if (-not $files) { throw "No .vsix produced in SSMS22/bin/Release" }
          $files | ForEach-Object { Write-Host "Built $($_.FullName)" }
          # Show what is inside, so a missing dll/pkgdef is visible in the log.
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          foreach ($f in $files) {
            $zip = [IO.Compression.ZipFile]::OpenRead($f.FullName)
            $zip.Entries | ForEach-Object { Write-Host "  $($_.FullName) ($($_.Length) bytes)" }
            $names = $zip.Entries.FullName
            $zip.Dispose()
            foreach ($req in 'extension.vsixmanifest','WakaTime.dll','WakaTime.pkgdef','WakaTime.Shared.ExtensionUtils.dll') {
              if ($names -notcontains $req) { throw "VSIX is missing $req" }
            }
          }

      - uses: actions/upload-artifact@v4
        with:
          name: WakaTime.SSMS22.vsix
          path: |
            SSMS22/bin/Release/*.vsix
            Install-SSMS22.ps1
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: SSMS22/bin/Release/*.vsix
